[project]
name = "mcp-server-griddb"
version = "1.0.0"
description = "A simple GridDB MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]<=1.30.0","jpype1<=1.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
mcp-server-griddb = "mcp_server_griddb:main"
